name: Build STM Programmer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            build-essential libstdc++-arm-none-eabi-newlib python3 git

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_FETCH_FROM_GIT=ON ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Show output
        run: ls -la build/*.uf2 2>/dev/null || echo "No UF2 found"

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-uf2
          path: build/stm_programmer.uf2
          if-no-files-found: error

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-elf
          path: build/stm_programmer.elf
          if-no-files-found: warn
