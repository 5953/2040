name: Build STM Programmer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi \
            build-essential libstdc++-arm-none-eabi-newlib python3 git

      - name: Download FatFs
        run: |
          mkdir -p fatfs/source
          cd fatfs/source
          wget -q http://elm-chan.org/fsw/ff/arc/ff15.zip || \
          curl -sL -o ff15.zip http://elm-chan.org/fsw/ff/arc/ff15.zip || \
          curl -sL -o ff15.zip https://elm-chan.org/fsw/ff/arc/ff15.zip
          unzip -o ff15.zip
          rm -f ff15.zip
          rm -f ffconf.h
          echo "=== FatFs files ===" && ls -la
          cd ../..

      - name: Verify dependencies
        run: |
          if [ ! -f fatfs/source/ff.c ]; then
            echo "ERROR: FatFs download failed, trying GitHub mirror..."
            cd fatfs/source
            git clone --depth 1 https://github.com/abbrev/fatfs.git temp_repo
            cp temp_repo/ff.c temp_repo/ff.h temp_repo/ffsystem.c temp_repo/ffunicode.c temp_repo/diskio.h .
            rm -rf temp_repo ffconf.h
            cd ../..
          fi
          if [ ! -f pico_sdk_import.cmake ]; then
            echo "ERROR: pico_sdk_import.cmake missing"
            exit 1
          fi
          echo "All dependencies OK"

      - name: Configure CMake
        run: |
          mkdir -p build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DPICO_SDK_FETCH_FROM_GIT=ON ..

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Show output files
        run: ls -la build/*.uf2 build/*.elf build/*.hex 2>/dev/null || true

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-uf2
          path: build/stm_programmer.uf2
          if-no-files-found: error

      - name: Upload ELF
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-elf
          path: build/stm_programmer.elf
          if-no-files-found: warn

      - name: Upload HEX
        uses: actions/upload-artifact@v4
        with:
          name: stm_programmer-hex
          path: build/stm_programmer.hex
          if-no-files-found: warn
